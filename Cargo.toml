[package]
name = "mrkv"
version = "0.1.0"
edition = "2021"

[dependencies]

slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",             # Mandatory — compile error if missing
    "renderer-software",      # CPU renderer, no GPU/OpenGL needed
    "backend-winit-wayland",  # Wayland ONLY (no X11)
] }


comrak = "0.33"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
once_cell = "1.19"
ureq = "2.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
percent-encoding = "2.3"
mermaid-rs-renderer = { version = "0.3", default-features = false }

[build-dependencies]
slint-build = "1.18"
